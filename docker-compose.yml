services:
  liberty-claws:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: liberty-claws
    # Run as the host user so bind-mounted ./state and ./logs are writable
    # even with cap_drop: ALL.
    user: "${OPENCLAW_UID:-1000}:${OPENCLAW_GID:-1000}"
    restart: unless-stopped
    environment:
      - MOLTBOOK_API_KEY=${MOLTBOOK_API_KEY}
      - MOLTBOOK_SUBMOLT=${MOLTBOOK_SUBMOLT}
      - MOLTBOOK_TITLE_PREFIX=${MOLTBOOK_TITLE_PREFIX}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=1536
      - OPENCLAW_STATE_DIR=/app/state
      - OPENCLAW_CONFIG_PATH=/app/openclaw.gateway.json5
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      # Comment auto-reply tuning (consumed by scripts/reply_to_comments.js)
      - LCX_REPLY_LOOKBACK_HOURS=${LCX_REPLY_LOOKBACK_HOURS:-24}
      - LCX_REPLY_MAX_POSTS=${LCX_REPLY_MAX_POSTS:-10}
      - LCX_REPLY_POSTS_PER_RUN=${LCX_REPLY_POSTS_PER_RUN:-3}
      - LCX_REPLY_MAX_PER_RUN=${LCX_REPLY_MAX_PER_RUN:-2}
      - LCX_REPLY_ENABLE_SEED=${LCX_REPLY_ENABLE_SEED:-0}
      - LCX_REPLY_SEED_MAX_PER_RUN=${LCX_REPLY_SEED_MAX_PER_RUN:-1}
      - LCX_REPLY_ENABLE_POST_CACHE=${LCX_REPLY_ENABLE_POST_CACHE:-0}
      - LCX_REPLY_QUIET_POST_RECHECK_MINUTES=${LCX_REPLY_QUIET_POST_RECHECK_MINUTES:-10}
      - LCX_REPLY_MAX_PER_DAY=${LCX_REPLY_MAX_PER_DAY:-10}
      - LCX_REPLY_DRY_RUN=${LCX_REPLY_DRY_RUN:-0}
      - LCX_REPLY_LOCK_STALE_MINUTES=${LCX_REPLY_LOCK_STALE_MINUTES:-15}
      # Similar-agents outreach tuning (consumed by scripts/outreach_similar_agents.js)
      - LCX_OUTREACH_ENABLE=${LCX_OUTREACH_ENABLE:-0}
      - LCX_OUTREACH_LOOKBACK_HOURS=${LCX_OUTREACH_LOOKBACK_HOURS:-24}
      - LCX_OUTREACH_MAX_PER_DAY=${LCX_OUTREACH_MAX_PER_DAY:-5}
      - LCX_OUTREACH_POSTS_SCAN_LIMIT=${LCX_OUTREACH_POSTS_SCAN_LIMIT:-50}
      - LCX_OUTREACH_DISCOVER_HANDLE=${LCX_OUTREACH_DISCOVER_HANDLE:-}
      - LCX_OUTREACH_DRY_RUN=${LCX_OUTREACH_DRY_RUN:-0}
    ports:
      # Bind to localhost only (don't expose on LAN).
      - "127.0.0.1:18789:18789"
    volumes:
      - ./workspace:/app/workspace:ro
      - ./logs:/app/logs
      - ./state:/app/state
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
      - /run
    cap_drop:
      - ALL
    mem_limit: 2048m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
